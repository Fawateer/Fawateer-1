<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>نظام إدارة المبيعات الاحترافي</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --secondary: #8b5cf6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #0f172a;
            --dark-light: #1e293b;
            --dark-lighter: #334155;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.5);
            --border: rgba(255, 255, 255, 0.1);
            --bg-card: rgba(255, 255, 255, 0.03);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--dark);
            min-height: 100vh;
            direction: rtl;
            overflow-x: hidden;
            color: var(--text-primary);
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            background: var(--dark);
            min-height: 100vh;
            position: relative;
        }

        /* Login Screen */
        .login-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        }

        .login-logo {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(37, 99, 235, 0.3);
        }

        .login-logo svg {
            width: 60px;
            height: 60px;
            fill: white;
        }

        .login-title {
            font-size: 28px;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 10px;
            text-align: center;
        }

        .login-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 40px;
            text-align: center;
        }

        .login-form {
            width: 100%;
            max-width: 400px;
        }

        .profile-upload {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }

        .profile-image-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin-bottom: 15px;
        }

        .profile-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 3px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .profile-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-image svg {
            width: 50px;
            height: 50px;
            fill: var(--text-muted);
        }

        .profile-upload-btn {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 3px solid var(--dark);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }

        .profile-upload-btn svg {
            width: 20px;
            height: 20px;
            fill: white;
        }

        .profile-upload-input {
            display: none;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 15px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
            transition: transform 0.2s;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        /* Main App */
        .main-app {
            display: none;
        }

        .main-app.active {
            display: block;
        }

        .header {
            background: linear-gradient(135deg, var(--dark-light) 0%, var(--dark) 100%);
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .store-logo {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            overflow: hidden;
            background: var(--bg-card);
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .store-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .store-logo svg {
            width: 25px;
            height: 25px;
            fill: var(--text-muted);
        }

        .header-title h1 {
            font-size: 18px;
            color: var(--text-primary);
            font-weight: 800;
            margin-bottom: 3px;
        }

        .header-title p {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .logout-btn {
            width: 40px;
            height: 40px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .logout-btn svg {
            width: 20px;
            height: 20px;
            fill: var(--danger);
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 480px;
            margin: 0 auto;
            background: linear-gradient(135deg, var(--dark-light) 0%, var(--dark) 100%);
            display: flex;
            justify-content: space-around;
            padding: 12px 0 calc(12px + env(safe-area-inset-bottom));
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5);
            border-top: 1px solid var(--border);
            z-index: 100;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.3s;
            background: transparent;
            border: none;
            color: var(--text-muted);
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-icon {
            width: 24px;
            height: 24px;
            transition: all 0.3s;
        }

        .nav-item.active .nav-icon {
            transform: scale(1.1);
        }

        .nav-icon svg {
            width: 100%;
            height: 100%;
            fill: currentColor;
        }

        .nav-label {
            font-size: 11px;
            font-weight: 600;
        }

        /* Content */
        .content {
            padding: 15px;
            padding-bottom: calc(80px + env(safe-area-inset-bottom));
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Dashboard Stats */
        .dashboard-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.3);
        }

        .today-sales {
            text-align: center;
        }

        .today-label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 600;
            margin-bottom: 10px;
        }

        .today-amount {
            font-size: 42px;
            font-weight: 800;
            color: white;
            margin-bottom: 5px;
        }

        .today-currency {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
        }

        .stat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-icon.blue {
            background: rgba(37, 99, 235, 0.1);
        }

        .stat-icon.green {
            background: rgba(16, 185, 129, 0.1);
        }

        .stat-icon.purple {
            background: rgba(139, 92, 246, 0.1);
        }

        .stat-icon.orange {
            background: rgba(245, 158, 11, 0.1);
        }

        .stat-icon svg {
            width: 20px;
            height: 20px;
        }

        .stat-icon.blue svg {
            fill: var(--primary);
        }

        .stat-icon.green svg {
            fill: var(--success);
        }

        .stat-icon.purple svg {
            fill: var(--secondary);
        }

        .stat-icon.orange svg {
            fill: var(--warning);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .stat-value {
            font-size: 24px;
            color: var(--text-primary);
            font-weight: 800;
        }

        .stat-unit {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 600;
            margin-right: 4px;
        }

        /* Sales History */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .date-filter {
            display: flex;
            gap: 8px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 4px;
        }

        .filter-btn {
            padding: 8px 16px;
            background: transparent;
            border: none;
            border-radius: 8px;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
        }

        .sales-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sale-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 15px;
        }

        .sale-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .sale-date {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .sale-total {
            font-size: 20px;
            color: var(--success);
            font-weight: 800;
        }

        .sale-products {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* Products */
        .search-box {
            margin-bottom: 20px;
            position: relative;
        }

        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
        }

        .search-icon svg {
            width: 100%;
            height: 100%;
            fill: var(--text-muted);
        }

        .search-input {
            width: 100%;
            padding: 14px 45px 14px 15px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 15px;
            font-weight: 500;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--primary);
        }

        .product-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .product-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 15px;
        }

        .product-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .product-name {
            font-size: 16px;
            color: var(--text-primary);
            font-weight: 700;
            flex: 1;
        }

        .product-price {
            font-size: 20px;
            color: var(--primary);
            font-weight: 800;
            margin-right: 10px;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-barcode {
            font-size: 11px;
            color: var(--text-muted);
            font-family: 'Courier New', monospace;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 10px;
            border-radius: 6px;
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: var(--danger);
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-delete:active {
            transform: scale(0.95);
        }

        /* Add Product */
        .camera-section {
            margin-bottom: 25px;
        }

        .barcode-input-wrapper {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .barcode-input-wrapper .form-input {
            flex: 1;
        }

        .btn-camera {
            width: 54px;
            height: 54px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-camera svg {
            width: 24px;
            height: 24px;
            fill: var(--text-secondary);
            transition: all 0.3s;
        }

        .btn-camera.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-color: transparent;
        }

        .btn-camera.active svg {
            fill: white;
        }

        .camera-container {
            display: none;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 15px;
            border: 2px solid var(--primary);
            position: relative;
        }

        .camera-container.active {
            display: block;
        }

        #camera-preview {
            width: 100%;
            border-radius: 14px;
        }

        .camera-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            text-align: center;
            font-weight: 600;
        }

        /* Scanner */
        #scanner-reader {
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 2px solid var(--primary);
        }

        .scan-result {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            margin-top: 20px;
        }

        .scan-result-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 15px;
        }

        .scan-result-icon svg {
            width: 100%;
            height: 100%;
            fill: var(--success);
        }
